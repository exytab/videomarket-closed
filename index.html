<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>VideoMarket — магазин закрито</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --fg:#1d1d1f; --muted:#6b6b70; --card:#fff; --line:#e4e4e0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --fg:#f2f2f2; --muted:#a0a0a6; --card:#1c1c1f; --line:#2c2c30; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:520px; width:100%; text-align:center; background:var(--card); border:1px solid var(--line);
         border-radius:16px; padding:40px 28px; }
  .logo { font-weight:700; letter-spacing:.02em; font-size:20px; margin-bottom:28px; }
  h1 { font-size:28px; line-height:1.25; margin:0 0 12px; }
  p { margin:0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="logo">VideoMarket</div>
  <h1>Магазин закрито</h1>
  <p>Інтернет-магазин videomarket.com.ua припинив роботу. Дякуємо всім нашим покупцям!</p>
</main>
</body>
</html>
